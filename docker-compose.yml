services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: recipemanager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/RecipeManager.Api/Dockerfile
    environment:
      ConnectionStrings__RecipeDb: "Host=db;Port=5432;Database=recipemanager;Username=postgres;Password=postgres"
      ASPNETCORE_ENVIRONMENT: Development
      Jwt__Issuer: RecipeManager
      Jwt__Audience: RecipeManager
      Jwt__AccessTokenExpiryMinutes: "30"
      Jwt__SigningKey: "docker-dev-signing-key-replace-in-production"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
    environment:
      VITE_API_URL: "http://localhost:8080/api/v1"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
